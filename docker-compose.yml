# Local stack: pgvector + backend + frontend (PRD 6.1, PRD 14).
# The corpus and uploaded tenders live on a mounted volume so they survive rebuilds.
# The frontend is static: VITE_API_URL is baked in at build time, so rebuild it
# (docker compose build frontend) when the address of the backend changes.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender}
      POSTGRES_DB: ${POSTGRES_DB:-tender}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender} -d ${POSTGRES_DB:-tender}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      # The in-container URL is built from the same credentials the db service
      # is given, so the two cannot drift apart on one machine (gate 4). The
      # host-side DATABASE_URL is for work outside compose.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD:-tender}@db:5432/${POSTGRES_DB:-tender}
      DATA_DIR: /var/lib/tender/data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEXT_API_KEY: ${LLM_TEXT_API_KEY:-}
      # Models and endpoints must be supplied at runtime.
      LLM_MODEL:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
      EMBEDDING_MODEL:
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/var/lib/tender/data
    depends_on:
      db:
        condition: service_healthy

  # The React app, served by nginx. The API address is baked into the bundle at
  # build time, so it has to be the address the browser uses (D-67).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
